{"name": "Update college hoops data", "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"name": "Install pandas", "run": "pip install pandas"}, {"name": "Fetch data", "run": "python fetch_ncaab.py"}, {"name": "Save data", "run": "git config user.name \"github-actions\"\ngit config user.email \"github-actions@users.noreply.github.com\"\ngit pull --rebase || true\ngit add data\ngit diff --cached --quiet || git commit -m \"Update college hoops data\"\ngit push\n"}]}}, "on": {"schedule": [{"cron": "0 15 * * *"}, {"cron": "0 21 * * *"}], "workflow_dispatch": null, "push": {"paths": ["fetch_ncaab.py", ".github/workflows/update.yml"]}}}
