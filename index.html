<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Critter Board: College Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#efe7d8;--surface:#fbf6ec;--ink:#221d16;--muted:#6f6556;--line:#dccfb8;--accent:#b4410e;--good:#15803d;--bad:#b91c1c;--warn:#a16207;--fav:#1d4ed8;--dog:#9a3412;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic svg,:root:not([data-theme="light"]) .tc-head .big svg{filter:drop-shadow(0 0 1.2px rgba(255,240,220,.55))}
:root:not([data-theme="light"]){--bg:#17140f;--surface:#211d17;--ink:#f2ead9;--muted:#a89d8b;--line:#3b342a;--accent:#fb923c;--good:#4ade80;--bad:#f87171;--warn:#facc15;--fav:#60a5fa;--dog:#fb923c;color-scheme:dark}}
:root[data-theme="dark"] .ic svg,:root[data-theme="dark"] .tc-head .big svg{filter:drop-shadow(0 0 1.2px rgba(255,240,220,.55))}
:root[data-theme="dark"]{--bg:#17140f;--surface:#211d17;--ink:#f2ead9;--muted:#a89d8b;--line:#3b342a;--accent:#fb923c;--good:#4ade80;--bad:#f87171;--warn:#facc15;--fav:#60a5fa;--dog:#fb923c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Barlow,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 12px 40px}
h1{font:700 28px/1 "Barlow Condensed","Arial Narrow",sans-serif;margin:2px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:600 14px Barlow,sans-serif;padding:8px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.game.faded{opacity:.72}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mu{font:700 18px/1.15 "Barlow Condensed",sans-serif}
.mu .fav{color:var(--fav)} .mu .dog{color:var(--muted);font-weight:600}
.tier{font:700 13px "Barlow Condensed",sans-serif;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--surface);white-space:nowrap}
.tier.early{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.lc{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.lc b{color:var(--ink)}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.f{font:600 12px Barlow,sans-serif;padding:2px 8px;border-radius:999px}
.f.bet{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.f.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.f.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.f.info{background:color-mix(in srgb,var(--fav) 15%,transparent);color:var(--fav)}
details{margin-top:6px}
summary{font-size:13px;color:var(--accent);cursor:pointer}
.pill{display:grid;grid-template-columns:7.5em 1fr 1fr 2.6em;gap:6px;align-items:center;font-size:12.5px;margin-top:5px}
.gap{text-align:right;font-variant-numeric:tabular-nums}
.inj{font-size:12.5px;margin-top:6px;line-height:1.5}
.inj .tm{font-weight:700;margin-right:4px}
.inj .i{display:inline-block;margin:0 6px 2px 0;padding:1px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.inj .i.out{background:color-mix(in srgb,var(--bad) 16%,transparent);border-color:transparent;color:var(--bad);font-weight:600}
.inj .i.dbt{background:color-mix(in srgb,var(--warn) 18%,transparent);border-color:transparent;color:var(--warn);font-weight:600}
.inj .i.q{color:var(--muted)}
.inj .i.old{opacity:.6}
.inj .none{color:var(--muted)}
.pick{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.seg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:5px;font-size:12.5px}
.seg span{color:var(--muted);min-width:5.2em}
.seg button{font:600 13px Barlow,sans-serif;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.save{margin-top:7px;font:700 14px Barlow,sans-serif;padding:7px 14px;border-radius:9px;border:0;background:var(--accent);color:#fff}
.save:disabled{opacity:.45}
.mine{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.mine b{font:700 15px "Barlow Condensed",sans-serif}
.st{font:700 11px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:999px;border:1px solid var(--line)}
.st.win{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:transparent}
.st.loss{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:transparent}
.link{background:none;border:0;color:var(--accent);font:600 13px Barlow,sans-serif;padding:0;text-decoration:underline}
.setup input{width:100%;font:500 14px Barlow,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:6px 0}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:4px}
.rec .h{color:var(--muted);font-size:12px}
.banner{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12.5px;margin-bottom:8px}
.bar{position:relative;height:9px;background:color-mix(in srgb,var(--line) 70%,transparent);border-radius:5px}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar em{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.xp{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.xp input{width:5.5em;font:500 15px Barlow,sans-serif;padding:5px 7px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.status{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
.search{width:100%;font:500 16px Barlow,sans-serif;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:8px}
.legend{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
.where{font:600 10.5px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:2px}
.duo{display:flex;align-items:center;gap:8px}
.ic{width:46px;height:50px;flex:none}
.ic svg{width:46px;height:50px;display:block}
.sp{font:600 11px Barlow,sans-serif;color:var(--muted);text-align:center;margin-top:1px}
.day{font:700 16px "Barlow Condensed",sans-serif;margin:14px 0 6px;color:var(--accent)}
.prev{font:600 11px Barlow,sans-serif;color:var(--muted);border:1px dashed var(--muted);border-radius:999px;padding:1px 6px;margin-left:6px}
.cb{display:flex;flex-direction:column;align-items:center;width:64px;flex:none}
.dots{display:flex;gap:2px;margin-top:3px}
.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid;display:block}
.mini{font:600 10.5px Barlow,sans-serif;color:var(--muted);margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lowato{color:var(--bad);font-weight:700}
.rk{font:700 11px "Barlow Condensed",sans-serif;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--surface)}
.tap{cursor:pointer}
.toggle{display:flex;gap:6px;margin-bottom:8px}
.toggle button{font:600 13px Barlow,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.more{display:block;width:100%;margin:6px 0;font:600 14px Barlow,sans-serif;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
/* full-screen swipe cards */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov[hidden]{display:none}
.ovbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.ovbar button{font:700 18px Barlow,sans-serif;border:0;background:none;color:var(--ink);padding:4px 8px}
.ovtitle{font:700 16px "Barlow Condensed",sans-serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;gap:5px}
.pager i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.pager i.on{background:var(--accent)}
.ovtrack{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior:contain}
.ovtrack::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 30px)}
.panel>div{max-width:560px;margin:0 auto}
.tc-head{display:flex;gap:12px;align-items:center}
.tc-head .big svg{width:104px;height:114px;display:block}
.tc-name{font:700 22px/1.1 "Barlow Condensed",sans-serif}
.rose{display:block;margin:6px auto 0;max-width:340px;width:100%}
.roses{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.roses .rose{max-width:180px}
.tl{display:grid;grid-template-columns:12px 1fr auto auto;gap:4px 8px;align-items:center;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.tl .sw{width:11px;height:11px;border-radius:3px}
.tl .h{color:var(--muted);font-size:11.5px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.nums div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:11.5px;color:var(--muted)}
.nums b{display:block;font:700 17px "Barlow Condensed",sans-serif;color:var(--ink)}
.scan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 0 8px}
.scan summary{font:700 16px "Barlow Condensed",sans-serif;color:var(--ink)}
.scan summary b{color:var(--accent)}
.sg{display:grid;grid-template-columns:6.8em 1fr 1fr;gap:4px 6px;align-items:center;font-size:12.5px;margin-top:6px}
.sg.g1{grid-template-columns:6.8em 1fr}
.sg select{width:100%;min-width:0;font:500 13px Barlow,sans-serif;padding:5px 4px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sg select.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:700}
.sg .h{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.sg .sh{grid-column:1/-1;font:700 12px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:6px}
.saved{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.chip button{font:600 13px Barlow,sans-serif;border:0;background:var(--bg);color:var(--ink);padding:5px 10px}
.chip button+button{padding:5px 9px;color:var(--muted);border-left:1px solid var(--line)}
.chip.on button:first-child{background:var(--ink);color:var(--surface)}
.savebar{display:flex;gap:8px;align-items:center;margin-top:8px}
.savebar input{flex:1;min-width:0;font:500 15px Barlow,sans-serif;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.savebar .save{margin-top:0}
.scanon{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nextg{margin-top:6px;font:600 13px Barlow,sans-serif;padding:5px 11px;border-radius:999px;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.game.hl{box-shadow:0 0 0 3px var(--accent);transition:box-shadow .3s}
.early .ic{opacity:.55}
.passrow{display:flex;justify-content:flex-end;margin-top:6px}
.passbtn{font:600 12px Barlow,sans-serif;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.passbtn.on{border-color:var(--accent);color:var(--accent)}
.passline{margin:0 0 6px}
.tip{font:600 13px Barlow,sans-serif;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.tip.soon{color:var(--accent)}.tip.gone{color:var(--bad)}
.ic,.tc-head .big{position:relative}
.xo{position:absolute;left:4%;top:4%;width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.early .ic .xo{opacity:1}
.nbrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.nbbtn{font:600 13px Barlow,sans-serif;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.nbbtn.on{border-color:#e0453a;color:#e0453a;font-weight:700}
.nbnote{flex:1;min-width:8em;font:500 14px Barlow,sans-serif;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.streaky .bar i,.pill.streaky .bar i{opacity:.4}
.sec{font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
</style>
</head>
<body>
<main>
<h1>Critter Board</h1>
<p class="sub" id="sub">Loading…</p>
<div class="tabs" role="group" aria-label="View">
 <button data-v="up" aria-pressed="true">Upcoming</button>
 <button data-v="bet" aria-pressed="false">Bet Mode</button>
 <button data-v="teams" aria-pressed="false">Teams</button>
 <button data-v="movers" aria-pressed="false">Movers</button>
 <button data-v="record" aria-pressed="false">Record</button>
</div>
<div id="view"></div>
<div class="status" id="status"></div>
</main>
<div class="ov" id="ov" hidden role="dialog" aria-modal="true" aria-labelledby="ovt">
 <div class="ovbar"><button id="ovx" aria-label="Close">✕</button><span class="ovtitle" id="ovt"></span><span class="pager" id="ovp"></span></div>
 <div class="ovtrack" id="ovtrack"></div>
</div>
<script>
/* ---------- critter drawings (shared with the Serengeti page) ---------- */
let preyCut = 1;
const lerp = (a, b, x) => a + (b - a) * Math.max(0, Math.min(1, x));
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
const ART_PRED = ["Saber-tooth","Gorilla","Lion","Wolf","Weasel","Tiger","Jackal"];
const PRED = ["Fox", "Bobcat", "Wolf", "Mountain lion", "Tiger"], PREY = ["Rat", "Rabbit", "Goat", "Elk", "Bison"];
/* each animal borrows one of the trait-built faces; size scales it */
const ART = {"Fox": "Jackal", "Bobcat": "Weasel", "Wolf": "Wolf", "Mountain lion": "Lion", "Tiger": "Tiger", "Rat": "Hare", "Rabbit": "Rabbit", "Goat": "Goat", "Elk": "Ram", "Bison": "Ram"};
function species(t){
  const pred = t.core >= 4 || t.net >= 0.85;
  if (pred){
    if (t.fang >= 0.9 && t.net >= 0.97 && t.core >= 5) return "Saber-tooth";
    if (t.ato >= 0.85 && t.efg >= 0.85 && t.net >= 0.85) return "Gorilla";
    if (t.reb >= 0.8 && t.paint >= 0.75) return "Lion";
    if (t.press >= 0.7 && t.fb >= 0.6) return "Wolf";
    if ((t.press >= 0.7 || t.stl >= 0.75) && t.reb < 0.6) return "Weasel";
    if (t.core >= 5) return "Tiger";
    return "Jackal";
  }
  if (t.prey >= preyCut) return t.ato < 0.4 ? "Rabbit" : "Goat";
  if (t.prey >= 0.6) return t.ato < 0.4 ? "Hare" : "Ram";
  return "Blob";
}
function predator(t, sp, flip){
  const cx = 150, cy = 172, id = "g" + Math.abs(t.n.split("").reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 7));
  const P = {"Saber-tooth":{W:96,R:86,chin:.95},"Gorilla":{W:104,R:84,chin:.55},"Lion":{W:90,R:84,chin:.85},"Wolf":{W:76,R:88,chin:1.0},
             "Weasel":{W:60,R:94,chin:1.05},"Tiger":{W:96,R:86,chin:.85},"Jackal":{W:72,R:84,chin:1.0}}[sp];
  const W = P.W, R = P.R;
  const base = shade(t.col, -0.12), deep = shade(t.col, -0.62), hi = shade(t.col, 0.25), ink = "#0b0a09";
  const face = sp === "Gorilla" ? shade(t.col, 0.45) : sp === "Lion" ? "#d9b26a" : shade(t.col, 0.38);
  const iris = {"Weasel":"#ef4444","Gorilla":"#f97316","Wolf":"#facc15","Jackal":"#facc15"}[sp] || "#fbbf24";
  let s = `<defs><radialGradient id="${id}h" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="${hi}"/><stop offset=".7" stop-color="${base}"/><stop offset="1" stop-color="${deep}"/></radialGradient>
    <filter id="${id}glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  // speed lines (fast break)
  if (t.fb > 0.55){ const k = Math.round((t.fb - 0.5) * 10); for (let i = 0; i < k; i++){ const y = cy - 46 + i * 20; s += `<path d="M${cx - W - 18 - (i % 2) * 8} ${y} h-${34 + (i * 7) % 20}" stroke="${deep}" stroke-width="4" stroke-linecap="round" opacity=".5"/>`; } }
  // lion mane (glass + paint)
  if (sp === "Lion"){ const n = 26, r1 = R * 1.18, r2 = R * (1.48 + 0.18 * t.reb); let d = "";
    for (let i = 0; i < n * 2; i++){ const a = i / (n * 2) * 2 * Math.PI - Math.PI / 2, r = i % 2 ? r1 : r2 * (0.92 + 0.08 * Math.sin(i * 1.7));
      d += (i ? "L" : "M") + (cx + Math.cos(a) * r * 1.02).toFixed(1) + " " + (cy + 6 + Math.sin(a) * r).toFixed(1); }
    s += `<path d="${d}Z" fill="${shade(t.col, -0.45)}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`; }
  // gorilla crest
  if (sp === "Gorilla") s += `<path d="M${cx - 40} ${cy - R + 14} Q ${cx} ${cy - R - 34} ${cx + 40} ${cy - R + 14} Z" fill="${deep}" stroke="${ink}" stroke-width="3"/>`;
  // ears
  const torn = t.ato < 0.4;
  [-1, 1].forEach(dd => {
    let e;
    if (sp === "Wolf" || sp === "Jackal"){ const bx = cx + dd * W * 0.55, by = cy - R * 0.62; e = `<path d="M${bx - dd * 4} ${by + 20} L${bx + dd * 30} ${by - 58} L${bx + dd * 40} ${by + 14} Z" fill="${base}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M${bx + dd * 10} ${by + 10} L${bx + dd * 29} ${by - 38} L${bx + dd * 32} ${by + 8} Z" fill="${deep}"/>`; }
    else if (sp === "Weasel"){ e = `<circle cx="${cx + dd * W * 0.8}" cy="${cy - R * 0.62}" r="14" fill="${base}" stroke="${ink}" stroke-width="3"/><circle cx="${cx + dd * W * 0.8}" cy="${cy - R * 0.62}" r="7" fill="${deep}"/>`; }
    else if (sp === "Gorilla"){ e = `<ellipse cx="${cx + dd * (W + 4)}" cy="${cy - 6}" rx="12" ry="18" fill="${base}" stroke="${ink}" stroke-width="3"/>`; }
    else { const bx = cx + dd * W * 0.66, by = cy - R * 0.72; e = `<path d="M${bx - dd * 26} ${by + 22} L ${bx + dd * 10} ${by - 52} L ${bx + dd * 34} ${by + 14} Z" fill="${base}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><path d="M${bx - dd * 10} ${by + 12} L ${bx + dd * 10} ${by - 32} L ${bx + dd * 22} ${by + 10} Z" fill="${deep}"/>`; }
    if (torn && sp !== "Gorilla") e += `<path d="M${cx + dd * W * 0.7} ${cy - R * 0.98} l${dd * 8} 10 l${dd * -10} 6" fill="#f6efe2" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`;
    s += e;
  });

        if(+el.value) SCAN[side][k] = +el.value; else delete SCAN[side][k];
        delete SCAN.name; PIN = null; el.classList.toggle("on", +el.value > 0); changed(false); });
    };
    const changed = rebuild => { store.set("critterScanNow", SCAN); if(rebuild) wire();
      const sm = document.querySelector("#scanbox summary"), n = scanCount(SCAN); if(sm) sm.innerHTML = `Scanner${n ? ` · <b>${n} filter${n > 1 ? "s" : ""} on</b>` : ""}`; draw(); };
    $("view").onclick = e => {
      const ps = e.target.closest("[data-pass],[data-showpassed],[data-showstarted]");
      if(ps){ if(ps.dataset.showstarted){ SHOWSTARTED = !SHOWSTARTED; }
        else if(ps.dataset.pass){ const id = ps.dataset.pass; if(PASSED[id]) delete PASSED[id]; else PASSED[id] = new Date().toISOString().slice(0, 10); savePassed(); }
        else SHOWPASSED = !SHOWPASSED;
        PIN = null; draw(); return; }
      const b = e.target.closest("[data-scanmode],[data-scanload],[data-scandel],[data-scansave],[data-scanclear]"); if(!b) return;
      if(b.dataset.scanmode){ SCAN.mode = b.dataset.scanmode; delete SCAN.name; PIN = null; changed(true); }
      else if(b.dataset.scanload){ const sv = SAVED[b.dataset.scanload]; if(sv){ SCAN = Object.assign({}, JSON.parse(JSON.stringify(sv)), {open: true, name: b.dataset.scanload}); PIN = null; changed(true); } }
      else if(b.dataset.scandel){ delete SAVED[b.dataset.scandel]; store.set("critterScans", SAVED); changed(true); }
      else if(b.dataset.scansave){ const name = $("scanname").value.trim(); if(!name || !scanCount(SCAN)){ $("scanname").placeholder = scanCount(SCAN) ? "Type a name first" : "Set a filter first"; return; }
        SAVED[name] = {mode: SCAN.mode, a: SCAN.a, b: SCAN.b, g: SCAN.g}; SCAN.name = name; store.set("critterScans", SAVED); changed(true); }
      else if(b.dataset.scanclear){ SCAN = {mode: SCAN.mode, a: {}, b: {}, g: {}, open: SCAN.open}; PIN = null; changed(true); }
    };
    $("uq").insertAdjacentHTML("beforebegin", `<div class="legend">Sorted by pillar dominance (favorite ahead by 0.5+ in each of 4 pillars), then fewest underdog edges, then spread. Faded cards are early: fewer than 5 games for one team.<br>
      Apex dots, in order: ${TRAITS.map(([, l, c]) => `<b style="color:${c}">${l}</b>`).join(" · ")}. Filled = apex level. <b>Tap a matchup</b> for full team cards, then swipe.<br>
      Food chain: predators ${PRED.join(" < ")}; prey ${PREY.join(" < ")}. Size = the toughest level of team it has proven itself against: predators by beating them, prey by leading or tied at halftime.</div>`);
    $("uq").addEventListener("input", () => { PIN = null; draw(); }); wire(); draw();
    DRAW_UP = draw; return;
  }
  $("view").onclick = null;
  if(view === "bet"){
    renderBet(v);
  } else if(view === "record"){
    renderRecord(v);
  } else if(view === "teams"){
    v.innerHTML = `<input class="search" id="q" placeholder="Search a team" autocomplete="off">
      <div class="toggle" role="group" aria-label="Sort"><button data-ord="best" aria-pressed="${teamOrder === "best"}">Best first</button><button data-ord="worst" aria-pressed="${teamOrder === "worst"}">Worst first</button></div>
      <div class="legend">Rank blends all four pillars and all six apex traits, each adjusted for schedule and weighted by how consistently it shows up. Teams need 2 games to be ranked.</div><div id="tl"></div>`;
    let limit = 20;
    const draw = () => { const q = $("q").value.trim().toLowerCase();
      const ids = Object.keys(TM).filter(k => !q || TM[k].name.toLowerCase().includes(q));
      const rk = k => (TM[k].apex && TM[k].apex.rank) || null;
      const ranked = ids.filter(rk).sort((a, b) => teamOrder === "best" ? rk(a) - rk(b) : rk(b) - rk(a));
      const rest = ids.filter(k => !rk(k)).sort((a, b) => TM[b].games - TM[a].games || TM[a].name.localeCompare(TM[b].name));
      const list = ranked.concat(rest);
      $("tl").innerHTML = list.slice(0, limit).map(k => `<div class="game${TM[k].stage === "scored" ? "" : " faded"}">${teamCard(k, false, true)}</div>`).join("") +
        (list.length > limit ? `<button class="more" id="tmore">Show more (${list.length - limit} left)</button>` : "") || `<div class="empty">No teams match.</div>`;
      const m = $("tmore"); if(m) m.onclick = () => { limit += 20; draw(); };
    };
    v.querySelectorAll("[data-ord]").forEach(b => b.onclick = () => { teamOrder = b.dataset.ord; render(); });
    $("q").addEventListener("input", draw); draw();
  } else {
    const M = (MV && MV.movers) || [];
    v.innerHTML = `<div class="legend">Teams whose critter changed since about a week ago, whose last 5 games moved a pillar by 0.75+, or who won 4 of their last 5. <b>Real shift</b> = winning with better pillars. <b>Hot streak</b> = winning without them, often shooting.</div>` +
      (M.map(m => `<div class="game"><div class="top"><div class="duo">${icon(m.team, false)}<div class="mu">${m.name}<br><span class="dog">${m.then && m.then !== m.now ? `${m.then} → ${m.now}` : m.now} · last 5: ${m.last5}</span></div></div>${m.label ? `<span class="tier${m.label.startsWith("Real") ? "" : " early"}">${m.label}</span>` : ""}</div>
        ${Object.keys(m.jumps).length ? `<div class="flags">${Object.entries(m.jumps).map(([p, d]) => `<span class="f ${d > 0 ? "bet" : "bad"}">${p} ${d > 0 ? "+" : ""}${d.toFixed(1)}</span>`).join("")}</div>` : ""}${nextBtn(m.team)}</div>`).join("") ||
      `<div class="empty">No movers yet. This fills in once teams reach 5 games and there's a week of daily snapshots to compare against.</div>`);
  }
}
document.addEventListener("click", e => {
  const nx = e.target.closest("[data-next]"); if(nx){ goNext(nx.dataset.next); return; }
  const nb = e.target.closest("[data-nobet]");
  if(nb){ const id = nb.dataset.nobet;
    if(NOBET[id]) delete NOBET[id]; else NOBET[id] = {date: new Date().toISOString().slice(0, 10), note: ""};
    saveNoBet(); pushNoBet(id); refreshAll(); return; }
  if(e.target.closest("button,input,a,summary,details,select")) return;
  const o = e.target.closest("[data-open]"); if(o) openGame(o.dataset.open);
});
$("ovx").onclick = () => closePanels(false);
window.addEventListener("popstate", () => closePanels(true));
document.addEventListener("keydown", e => { if(e.key === "Escape") closePanels(false); });
$("ovtrack").addEventListener("scroll", () => { const tr = $("ovtrack"), i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  $("ovp").querySelectorAll("i").forEach((d, j) => d.classList.toggle("on", j === i)); }, {passive: true});
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-pk],[data-save],[data-del],[data-act],[data-goto]"); if(!t) return;
  if(t.dataset.pk){ const gid = t.dataset.pk, s = SEL[gid] = SEL[gid] || {}; s[t.dataset.k] = t.dataset.k === "conf" ? Number(t.dataset.val) : t.dataset.val; redrawPick(gid); }
  else if(t.dataset.save){ savePick(t.dataset.save); }
  else if(t.dataset.del){ removePick(t.dataset.del, t.dataset.gid); }
  else if(t.dataset.goto){ document.querySelector(`[data-v="${t.dataset.goto}"]`).click(); }
  else if(t.dataset.act === "changeurl"){ LOG.url = ""; render(); }
  else if(t.dataset.act === "seturl"){
    const url = $("logurl").value.trim(), msg = $("logmsg");
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){ msg.textContent = "That doesn't look like an Apps Script web app link."; return; }
    msg.textContent = "Checking…";
    try{ const r = await (await fetch(url, {method: "POST", body: JSON.stringify({action: "ping"})})).json(); if(!r.ok) throw 0;
      LOG.url = url; try{ localStorage.setItem("critterLogUrl", url); }catch(err){}
      LOG.loaded = false; await loadLog(); render();
    }catch(err){ msg.textContent = "Couldn't reach it. Check that the deployment's access is set to Anyone."; }
  }
});
document.addEventListener("input", e => {
  const el = e.target; if(!el.dataset || !el.dataset.sw) return;
  const out = $("o" + el.id.slice(1)), x = parseFloat(el.value), sw = parseFloat(el.dataset.sw);
  if(!out) return; if(isNaN(x)){ out.textContent = ""; return; }
  const p = x > 1 ? x / 100 : x, gap = sw - p;
  out.innerHTML = `<b style="color:${gap >= 0.03 ? "var(--good)" : gap <= -0.03 ? "var(--bad)" : "var(--muted)"}">${gap >= 0 ? "+" : ""}${Math.round(gap * 100)} pts ${gap >= 0.03 ? "cheap" : gap <= -0.03 ? "pricey" : "fair"}</b>`;
});
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { view = b.dataset.v; document.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
(async () => {
  try{
    /* Read data straight from the repo, so a slow GitHub Pages rebuild never leaves the board a day behind */
    const m = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split("/").filter(Boolean)[0];
    const base = m && repo ? `https://raw.githubusercontent.com/${m[1]}/${repo}/main/data/` : "data/";
    const load = f => fetch(base + f + ".json?t=" + Date.now(), {cache: "no-store"}).then(r => r.json());
    let s, t, l;
    try{ [s, t, l] = await Promise.all(["slate", "teams", "latest"].map(load)); }
    catch(e){ [s, t, l] = await Promise.all(["slate", "teams", "latest"].map(f => fetch(`data/${f}.json`, {cache: "no-store"}).then(r => r.json()))); }
    S = s; TM = t.teams || {}; L = l; LG3 = t.lg3 || 0.33;
    const live = new Set(S.games.filter(g => g.state !== "post").map(g => String(g.id)));
    Object.keys(PASSED).forEach(id => { if(!live.has(id)) delete PASSED[id]; }); savePassed();
    try{ MV = await load("movers"); }catch(e){ MV = null; }
    const n = Object.values(TM).filter(x => x.stage === "scored").length;
    $("sub").textContent = `${S.date} · ${S.games.filter(g => !g.day || g.day === S.date).length} games today · ${n} teams with 5+ games`;
    $("status").innerHTML = "Data: " + Object.entries(L.status || {}).filter(([k]) => k !== "injury_meta").map(([k, v]) => `${k} ${v}`).join(" · ") + `<br>Updated ${new Date(L.updated).toLocaleString()}`;
    const zf = L.zero_flags || [];
    if(zf.length) $("status").insertAdjacentHTML("beforeend", `<details><summary>Box score numbers to check (${zf.length})</summary>
      <div class="lc">Blanked = left out of the ratings as implausible. Kept = still counted, but unusual enough to look at. Tap a game for ESPN's box score.</div>
      ${zf.map(z => `<div class="lc"><a href="https://www.espn.com/mens-college-basketball/boxscore/_/gameId/${z.game}" target="_blank" rel="noopener">${z.date} ${z.team} vs ${z.opp}</a>: ${z.stat.replace(/_/g, " ")} ${z.value ?? "blank"} (${z.why}) · <b>${z.blanked ? "blanked" : "kept"}</b></div>`).join("")}</details>`);
    const im = (L.status || {}).injury_meta;
    if(im && im.scacc_ok === false) $("sub").insertAdjacentHTML("afterend", `<div class="banner">Some SCACC injury pages didn't load this run. Players from those conferences are shown from the last good run.</div>`);
    if(im && im.box_stale) $("sub").insertAdjacentHTML("afterend", `<div class="banner">Box scores are running behind, so "played last game" may be wrong. New-absence flags (Wounded prey, Favorite wounded) are off until they catch up.</div>`);
  }catch(e){ $("sub").textContent = "Couldn't load data. Run the workflow once from the Actions tab."; }
  render();
  await loadLog(); render();
})();
</script>
